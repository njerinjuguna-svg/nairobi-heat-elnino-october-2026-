const BOUNDS = [[-1.5107559890081, 36.62879882144226], [-0.9969675769208385, 37.106081214775955]];

const map = L.map("map", { zoomControl: true }).fitBounds(BOUNDS);
const imagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 18, attribution: "Imagery © Esri" });
const light = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  { maxZoom: 19, attribution: "© OpenStreetMap contributors © CARTO" }).addTo(map);

const heat = L.imageOverlay("outputs_02/heat_relative_30m.png", BOUNDS, { opacity: 0.75,
  attribution: "Landsat 8–9 (USGS/NASA), ESA WorldCover, WorldPop" }).addTo(map);

const PRIO = { "Act first": "#7a0177", "Act next": "#dd3497" };
const RULE = { "Meets both": "#1b7837", "Below 30% canopy": "#eda100", "Too far from green space": "#2a78d6", "Fails both": "#b2182b" };
const treeColor = t => t >= 40 ? "#00441b" : t >= 30 ? "#1b7837" : t >= 20 ? "#5aae61" : t >= 10 ? "#a6dba0" : t >= 3 ? "#d9f0d3" : "#f7f7f7";

function popup(p) {
  const name = p.area === "Nairobi (rest of county)" ? "Nairobi County" : p.area;
  return `<b>${name}</b><table>
    <tr><td>Surface heat</td><td><b>${p.lst_rel > 0 ? "+" : ""}${p.lst_rel} °C</b> vs middle</td></tr>
    <tr><td>Tree cover</td><td>${p.tree_pct}%</td></tr>
    <tr><td>Built up</td><td>${p.built_pct}%</td></tr>
    <tr><td>Residents</td><td>${p.people_km2.toLocaleString()} per km²</td></tr>
    ${p.priority_class ? `<tr><td>Greening priority</td><td>${p.priority_class}</td></tr>` : ""}
    ${p.rule_class ? `<tr><td>3-30-300</td><td>${p.rule_class}</td></tr>` : ""}
  </table><a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">Open in Google Maps</a>`;
}
const base = { weight: 0.6, color: "#ffffff" };
const priority = L.geoJSON(GRID, {
  filter: f => PRIO[f.properties.priority_class],
  style: f => ({ ...base, color: PRIO[f.properties.priority_class], weight: 1.5, fillColor: PRIO[f.properties.priority_class], fillOpacity: 0.35 }),
  onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
}).addTo(map);
const trees = L.geoJSON(GRID, {
  style: f => ({ ...base, fillColor: treeColor(f.properties.tree_pct), fillOpacity: 0.8 }),
  onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
});
const rule = L.geoJSON(GRID, {
  filter: f => RULE[f.properties.rule_class],
  style: f => ({ ...base, fillColor: RULE[f.properties.rule_class], fillOpacity: 0.7 }),
  onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
});
const allSquares = L.geoJSON(GRID, {   // invisible click layer so every square has a popup
  style: { weight: 0, fillOpacity: 0 }, onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
}).addTo(map);
priority.bringToFront();

L.control.layers(
  { "Light map": light, "Satellite": imagery },
  { "Surface heat (30 m)": heat, "Greening priority": priority, "Tree cover (1 km)": trees, "3-30-300 gaps": rule },
  { collapsed: window.innerWidth < 600 }).addTo(map);

const legend = document.getElementById("legend");
function drawLegend() {
  let h = "";
  if (map.hasLayer(heat)) h += `<h2>Surface heat vs middle value</h2><div class="bar"></div>
    <div class="ticks"><span>−6 °C</span><span>0</span><span>+6 °C</span></div>
    <label class="op">Heat layer opacity<input id="op" type="range" min="0" max="1" step="0.05" value="${heat.options.opacity}"></label>`;
  if (map.hasLayer(priority)) h += `<h2 style="margin-top:10px">Greening priority</h2>` +
    Object.entries(PRIO).map(([k, c]) => `<div class="row"><span class="sw" style="background:${c}"></span>${k}</div>`).join("");
  if (map.hasLayer(trees)) h += `<h2 style="margin-top:10px">Tree cover</h2>` +
    [[40,"40%+"],[30,"30–40%"],[20,"20–30%"],[10,"10–20%"],[3,"3–10%"],[0,"under 3%"]].map(([t, k]) =>
      `<div class="row"><span class="sw" style="background:${treeColor(t)};border:1px solid #ccc"></span>${k}</div>`).join("");
  if (map.hasLayer(rule)) h += `<h2 style="margin-top:10px">3-30-300 standard</h2>` +
    Object.entries(RULE).map(([k, c]) => `<div class="row"><span class="sw" style="background:${c}"></span>${k}</div>`).join("");
  legend.innerHTML = h || "<div class='row'>Turn on a layer (top right)</div>";
  legend.style.display = "block";
  const op = document.getElementById("op");
  if (op) op.oninput = e => heat.setOpacity(+e.target.value);
}
map.on("overlayadd overlayremove", () => { drawLegend(); priority.bringToFront(); });
drawLegend();
</script>
